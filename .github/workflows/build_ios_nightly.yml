name: Build iOS Nightly
on:
  workflow_dispatch:
  push:
    branches:
      - master
env:
  SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
  SIGN_KEY_STORE_PASSWORD: ${{ secrets.SIGN_KEY_STORE_PASSWORD }}
  SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
  SIGN_KEY_STORE_FILE: "/tmp/key.jks"
  GITHUB_USERNAME: ${{ secrets.NEXUS_USER }}
  GITHUB_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
  XCODE_PROJECT: iosApp
  MOBILE_DIRECTORY: iosApp
  IPA_NAME: XhuTimetable
jobs:
  build-ios:
    runs-on: macos-latest
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 设置JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'
      - name: 设置Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: 解密签名
        run: |
          echo ${{ secrets.SIGN_KEY_BASE64 }} | base64 --decode > /tmp/key.jks
          echo ${{ secrets.AG_CONNECT_JSON }} | base64 --decode > androidApp/agconnect-services.json
      - run: chmod a+x gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: 更新iOS应用版本号
        run: |
          ./gradlew composeApp:exportLibraryDefinitions
          ./gradlew composeApp:updateAppleBuildVersion
      - name: 安装Apple证书
        id: profile
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
          IOS_WIDGET_PROVISION_PROFILE: ${{ secrets.IOS_WIDGET_PROVISION_PROFILE }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          EXPORT_PLIST: ${{ secrets.IOS_EXPORT_PRODUCTION }}
        run: |
          set -euo pipefail
          : "${IOS_WIDGET_PROVISION_PROFILE:?Missing IOS_WIDGET_PROVISION_PROFILE secret}"
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$IOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISION_PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "$IOS_WIDGET_PROVISION_PROFILE" | base64 --decode > "$RUNNER_TEMP/widget.mobileprovision"
          printf '%s' "$EXPORT_PLIST" | base64 --decode > "$RUNNER_TEMP/ExportOptions.original.plist"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/app-profile.plist"
          security cms -D -i "$RUNNER_TEMP/widget.mobileprovision" > "$RUNNER_TEMP/widget-profile.plist"
          python3 iosApp/scripts/configure_signing.py \
            --app-profile "$RUNNER_TEMP/app-profile.plist" \
            --widget-profile "$RUNNER_TEMP/widget-profile.plist" \
            --export-options "$RUNNER_TEMP/ExportOptions.original.plist" \
            --output "$RUNNER_TEMP/ExportOptions.plist"
          # 导入同一个证书，为每个 Target 安装各自的描述文件。
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          for target in app widget; do
            UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/$target-profile.plist")
            cp "$RUNNER_TEMP/$target.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          done
      - name: 缓存Xcode编译数据
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-build
          restore-keys: xcode-build
      - name: 选择 Xcode 26.2
        # macos-15-arm64 默认仍是 Xcode 16.4 (iPhoneOS18.5.sdk)，但 Compose
        # Multiplatform 1.11.0 在 CMPLayoutRegion.o 中强引用 iOS 26 才有的
        # UIViewLayoutRegion 类，必须切到 Xcode 26.2 才能链接通过。
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: 验证小部件快照与签名配置
        run: |
          ./gradlew composeApp:testAndroidHostTest
          python3 -m unittest discover -s iosApp/scripts -p 'test_*.py'
          swiftc iosApp/WidgetShared/WidgetSnapshot.swift iosApp/WidgetTests/main.swift -o "$RUNNER_TEMP/widget-tests"
          "$RUNNER_TEMP/widget-tests" composeApp/build/widget-tests/snapshot.json
          plutil -lint iosApp/iosApp.xcodeproj/project.pbxproj
      - name: 构建iOS APP
        env:
          APP_PROFILE: ${{ steps.profile.outputs.app_uuid }}
          WIDGET_PROFILE: ${{ steps.profile.outputs.widget_uuid }}
          SIGNING_TEAM: ${{ steps.profile.outputs.team_id }}
        run: |
          cd ${{ env.MOBILE_DIRECTORY }}
          xcodebuild APP_PROVISIONING_PROFILE="$APP_PROFILE" WIDGET_PROVISIONING_PROFILE="$WIDGET_PROFILE" DEVELOPMENT_TEAM="$SIGNING_TEAM" -project ${{ env.XCODE_PROJECT }}.xcodeproj -scheme ${{ env.XCODE_PROJECT }} archive -archivePath "Actions" -configuration Release -arch arm64
      - name: 导出ipa
        run: |
          xcodebuild -exportArchive -archivePath ${{ env.MOBILE_DIRECTORY }}/Actions.xcarchive -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
      - name: 解密API密钥
        env:
          API_KEY_BASE64: ${{ secrets.IOS_APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode --output ~/private_keys/AuthKey_${{ secrets.IOS_APPSTORE_API_KEY_ID }}.p8
      - name: 上传到Testflight
        run: |
          xcrun altool --validate-app -f ${{ runner.temp }}/export/${{ env.IPA_NAME }}.ipa -t ios --apiKey ${{ secrets.IOS_APPSTORE_API_KEY_ID }} --apiIssuer ${{ secrets.IOS_APPSTORE_ISSUER_ID }}
          xcrun altool --upload-app -f ${{ runner.temp }}/export/${{ env.IPA_NAME }}.ipa -t ios --apiKey ${{ secrets.IOS_APPSTORE_API_KEY_ID }} --apiIssuer ${{ secrets.IOS_APPSTORE_ISSUER_ID }}
      - name: 上传文件
        uses: actions/upload-artifact@v7
        with:
          name: ipa-build
          path: ${{ runner.temp }}/export/${{ env.IPA_NAME }}.ipa
