# 个人测试构建；私有 Maven 凭据在 Codemagic 应用级变量组中配置。
workflows:
  ios-personal-unsigned:
    name: 西瓜课表 iOS 个人测试（未签名）
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "26.2"
      java: "21"
      groups:
        - private_maven
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan/dependencies
    # 首次配置采用手动构建，避免每次推送消耗 macOS 构建额度。
    scripts:
      - name: 检查环境及私有 Maven 凭据
        script: |
          set -euo pipefail
          # 兼容从原 Actions 迁入时保留的变量名；不输出凭据。
          export GITHUB_USERNAME="${GITHUB_USERNAME:-${NEXUS_USER:-}}"
          export GITHUB_PASSWORD="${GITHUB_PASSWORD:-${NEXUS_PASSWORD:-}}"
          if [[ -z "${GITHUB_USERNAME:-}" || -z "${GITHUB_PASSWORD:-}" ]]; then
            echo "请在 private_maven 变量组中配置 GITHUB_USERNAME 和 GITHUB_PASSWORD，并勾选 Secret。" >&2
            exit 1
          fi
          printf '%s\n' "GITHUB_USERNAME=$GITHUB_USERNAME" "GITHUB_PASSWORD=$GITHUB_PASSWORD" >> "$CM_ENV"
          java -version
          xcodebuild -version
          # 完整历史用于项目既有的 git 提交数版本号。
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --unshallow
          fi
          chmod a+x gradlew
          mkdir -p "$HOME/.gradle" build/ios-personal/logs
          printf '%s\n' 'org.gradle.configureondemand=true' >> "$HOME/.gradle/gradle.properties"
          cp iosApp/Configuration/Config.xcconfig.template iosApp/Configuration/Config.xcconfig
      - name: 准备候选校园安全组件
        script: |
          set -euo pipefail
          # 官方公开包使用固定 SHA-256 校验；不上传 IPA 安全资源。
          python3 -m unittest discover -s tools -p 'test_prepare_campus_ios_probe.py'
          python3 tools/prepare_campus_ios_probe.py --frameworks-output build/campus-ios-probe/frameworks
          # 在耗时的 Kotlin/Native 构建前检查厂商头文件与 ARC 兼容性。
          xcrun --sdk iphoneos clang -fsyntax-only -fobjc-arc -fblocks \
            -target arm64-apple-ios16.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -F build/campus-ios-probe/frameworks -DCAMPUS_COMPONENT_PROBE=1 \
            iosApp/iosApp/CampusComponentProbe.m
      - name: 更新许可证及 Apple 版本号
        script: |
          set -euo pipefail
          ./gradlew --configure-on-demand composeApp:exportLibraryDefinitions composeApp:updateAppleBuildVersion --stacktrace 2>&1 | tee build/ios-personal/logs/prepare.log
      - name: 验证共享 iOS 状态逻辑
        script: |
          set -euo pipefail
          ./gradlew --configure-on-demand composeApp:iosSimulatorArm64Test --stacktrace 2>&1 | tee build/ios-personal/logs/tests.log
      - name: 编译未签名 iPhone 应用
        script: |
          set -euo pipefail
          # updateAppleBuildVersion 会重写配置，必须在它执行完后追加检查包设置。
          # 仅此个人检查工作流链接候选 SDK，普通构建不加载它。
          cat >> iosApp/Configuration/Config.xcconfig <<'CONFIG'

          FRAMEWORK_SEARCH_PATHS = $(inherited) "$(SRCROOT)/../build/campus-ios-probe/frameworks"
          GCC_PREPROCESSOR_DEFINITIONS = $(inherited) CAMPUS_COMPONENT_PROBE=1
          OTHER_LDFLAGS = $(inherited) -ObjC -lJCore -lJPush -framework SecurityGuardSDK -framework SGMain -framework SGMiddleTier -framework SGSecurityBody -lc++ -lz -lresolv -framework Security -framework SystemConfiguration -framework CoreTelephony -framework CoreMotion -framework WebKit
          CONFIG
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-personal/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGN_ENTITLEMENTS= \
            DEVELOPMENT_TEAM= \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) PERSONAL_TEST_BUILD CAMPUS_COMPONENT_PROBE' \
            build 2>&1 | tee build/ios-personal/logs/xcodebuild.log
      - name: 打包个人测试 IPA
        script: |
          set -euo pipefail
          # 在独立暂存目录去除扩展与签名，保留原始编译产物供诊断。
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          output = Path('build/ios-personal')
          source = output / 'DerivedData/Build/Products/Debug-iphoneos/XhuTimetable.app'
          if not source.is_dir():
              raise SystemExit('没有找到 iOS .app 构建产物。')
          app = output / 'Payload/XhuTimetable.app'
          shutil.copytree(source, app, dirs_exist_ok=True, symlinks=True)
          for name in ('PlugIns', '_CodeSignature'):
              target = app / name
              if target.exists():
                  shutil.rmtree(target)
          (app / 'embedded.mobileprovision').unlink(missing_ok=True)
          PY
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-personal/Payload \
            build/ios-personal/XhuTimetable-personal-unsigned.ipa
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/ios-personal/XhuTimetable-personal-unsigned.ipa') as ipa:
              if 'Payload/XhuTimetable.app/Info.plist' not in ipa.namelist():
                  raise SystemExit('IPA 目录结构不正确。')
              if ipa.testzip() is not None:
                  raise SystemExit('IPA 文件校验失败。')
          PY
    artifacts:
      - build/ios-personal/*.ipa
      - build/ios-personal/logs/*.log
      - composeApp/build/reports/tests/iosSimulatorArm64Test/**
      - composeApp/build/test-results/iosSimulatorArm64Test/*.xml
