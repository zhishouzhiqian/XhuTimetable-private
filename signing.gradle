def signingConfig = project.extensions.getByName('android').signingConfigs.getByName('sign')
def releaseRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase(Locale.ROOT).contains('release')
}

def environmentValue = { String preferredName, String legacyName ->
    def preferredValue = System.getenv(preferredName)
    if (preferredValue != null && !preferredValue.trim().isEmpty()) {
        return preferredValue
    }
    return System.getenv(legacyName)
}

def keystorePath = environmentValue('ANDROID_KEYSTORE_PATH', 'SIGN_KEY_STORE_FILE')
def keystorePassword = environmentValue('ANDROID_KEYSTORE_PASSWORD', 'SIGN_KEY_STORE_PASSWORD')
def keyAlias = environmentValue('ANDROID_KEY_ALIAS', 'SIGN_KEY_ALIAS')
def keyPassword = environmentValue('ANDROID_KEY_PASSWORD', 'SIGN_KEY_PASSWORD')

if (releaseRequested) {
    def missingVariables = []
    if (keystorePath == null || keystorePath.trim().isEmpty()) missingVariables.add('ANDROID_KEYSTORE_PATH')
    if (keystorePassword == null || keystorePassword.trim().isEmpty()) missingVariables.add('ANDROID_KEYSTORE_PASSWORD')
    if (keyAlias == null || keyAlias.trim().isEmpty()) missingVariables.add('ANDROID_KEY_ALIAS')
    if (keyPassword == null || keyPassword.trim().isEmpty()) missingVariables.add('ANDROID_KEY_PASSWORD')
    if (!missingVariables.isEmpty()) {
        throw new GradleException(
            "Release 签名配置缺失，请设置环境变量：${missingVariables.join(', ')}"
        )
    }

    def keystoreFile = rootProject.file(keystorePath)
    if (!keystoreFile.isFile()) {
        throw new GradleException("Release keystore 文件不存在：${keystoreFile}")
    }

    signingConfig.storeFile = keystoreFile
    signingConfig.storePassword = keystorePassword
    signingConfig.keyAlias = keyAlias
    signingConfig.keyPassword = keyPassword
}
