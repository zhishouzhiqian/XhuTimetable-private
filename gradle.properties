#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M
kotlin.native.ignoreDisabledTargets=true
kotlin.incremental.native=true

#Gradle
org.gradle.caching=true
org.gradle.jvmargs=-Xmx6144M -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.overridePathCheck=true

# 华为 AGConnect 1.9.1.301 仍调用 applicationVariants，仅应用模块保留旧 DSL。
# 共享库使用新的 Android KMP 插件，所有模块继续启用 AGP 内置 Kotlin。
android.newDsl.optOut=:androidApp

ksp.useKSP2=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
